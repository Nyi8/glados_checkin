name: GLaDOS Checkin

on:
  schedule:
    # 北京时间 09:00；脚本内再随机等待 0-90 分钟才真正点击签到。
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: glados-checkin
  cancel-in-progress: false

jobs:
  checkin:
    runs-on: ubuntu-latest
    # 必须大于「随机等待上限 + 浏览器安装 + 重试」，默认上限 90 分钟。
    timeout-minutes: 150
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-browser.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-browser.txt

      - name: Cache Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements-browser.txt') }}

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Verify script (offline unit tests)
        run: python -B -m unittest -q

      - name: Run checkin script
        id: checkin
        continue-on-error: true
        timeout-minutes: 140
        env:
          # email 模式在当前浏览器登录后直接签到，不依赖手工导出的 Cookie/FP/UA。
          GLADOS_AUTH_MODE: ${{ vars.GLADOS_AUTH_MODE }}
          GLADOS_EMAIL: ${{ secrets.GLADOS_EMAIL }}
          QQ_IMAP_USERNAME: ${{ secrets.QQ_IMAP_USERNAME }}
          QQ_IMAP_AUTH_CODE: ${{ secrets.QQ_IMAP_AUTH_CODE }}
          GLADOS_MAIL_FROM: ${{ secrets.GLADOS_MAIL_FROM }}
          GLADOS_CODE_REGEX: ${{ vars.GLADOS_CODE_REGEX }}
          GLADOS_MAIL_TIMEOUT_SECONDS: ${{ vars.GLADOS_MAIL_TIMEOUT_SECONDS }}
          GLADOS_COOKIE: ${{ secrets.GLADOS_COOKIE }}
          GLADOS_USER_AGENT: ${{ vars.GLADOS_USER_AGENT }}
          # 登录设备的指纹；不配置时服务端会返回 code=4 / device-mismatch。
          GLADOS_FP: ${{ secrets.GLADOS_FP }}
          GLADOS_JITTER_MIN_MINUTES: ${{ vars.GLADOS_JITTER_MIN_MINUTES }}
          GLADOS_JITTER_MAX_MINUTES: ${{ vars.GLADOS_JITTER_MAX_MINUTES }}
          # 手动触发时立即签到，不定时触发的自动任务才做随机等待。
          GH_EVENT: ${{ github.event_name }}
          GLADOS_SCREENSHOT_ON_FAIL: "1"
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_USE_SSL: ${{ secrets.SMTP_USE_SSL }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
        run: python -u checkin.py

      - name: Upload failure screenshots
        if: steps.checkin.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: checkin-failure-screenshots
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7

      - name: Fail the job when checkin failed
        if: steps.checkin.outcome == 'failure'
        env:
          CHECKIN_OUTCOME: ${{ steps.checkin.outcome }}
        run: |
          echo "checkin step outcome: ${CHECKIN_OUTCOME}"
          exit 1
