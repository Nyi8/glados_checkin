name: GLaDOS Checkin

on:
  schedule:
    # 首次按北京时间 09:00 启动；后续由 random_schedule.py 同步 config 和下一次日期。
    # BEGIN GLADOS RANDOM SCHEDULE
    - cron: "46 1 20 10 *"
    # END GLADOS RANDOM SCHEDULE
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: glados-checkin
  cancel-in-progress: false

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-browser.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Select checkin backend
        id: backend
        env:
          GLADOS_AUTH_MODE: ${{ vars.GLADOS_AUTH_MODE }}
          GLADOS_CHECKIN_METHOD: ${{ vars.GLADOS_CHECKIN_METHOD }}
        run: |
          python - <<'PY'
          import os
          from api_checkin import resolve_backend
          backend = resolve_backend()
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('browser=' + str(backend == 'browser').lower() + '\n')
          print('Checkin backend: ' + backend)
          PY

      - name: Install browser dependencies
        if: steps.backend.outputs.browser == 'true'
        run: python -m pip install -r requirements-browser.txt

      - name: Cache Chromium
        if: steps.backend.outputs.browser == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements-browser.txt') }}

      - name: Install Chromium
        if: steps.backend.outputs.browser == 'true'
        run: python -m playwright install --with-deps chromium

      - name: Verify script (offline unit tests)
        run: python -B -m unittest -q

      - name: Verify login redirect handling (isolated browser test)
        if: steps.backend.outputs.browser == 'true'
        env:
          GLADOS_BROWSER_TESTS: "1"
        run: python -B -m unittest -q test_login_redirect

      - name: Run checkin script
        id: checkin
        continue-on-error: true
        timeout-minutes: 12
        env:
          # email 模式在当前浏览器登录后直接签到，不依赖手工导出的 Cookie/FP/UA。
          GLADOS_AUTH_MODE: ${{ vars.GLADOS_AUTH_MODE }}
          GLADOS_CHECKIN_METHOD: ${{ vars.GLADOS_CHECKIN_METHOD }}
          GLADOS_CHECKIN_TOKEN: ${{ vars.GLADOS_CHECKIN_TOKEN }}
          GLADOS_EMAIL: ${{ secrets.GLADOS_EMAIL }}
          QQ_IMAP_USERNAME: ${{ secrets.QQ_IMAP_USERNAME }}
          QQ_IMAP_AUTH_CODE: ${{ secrets.QQ_IMAP_AUTH_CODE }}
          GLADOS_MAIL_FROM: ${{ secrets.GLADOS_MAIL_FROM }}
          GLADOS_CODE_REGEX: ${{ vars.GLADOS_CODE_REGEX }}
          GLADOS_MAIL_TIMEOUT_SECONDS: ${{ vars.GLADOS_MAIL_TIMEOUT_SECONDS }}
          GLADOS_COOKIE: ${{ secrets.GLADOS_COOKIE }}
          GLADOS_USER_AGENT: ${{ vars.GLADOS_USER_AGENT }}
          # 登录设备的指纹；不配置时服务端会返回 code=4 / device-mismatch。
          GLADOS_FP: ${{ secrets.GLADOS_FP }}
          GLADOS_SCREENSHOT_ON_FAIL: "1"
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_USE_SSL: ${{ secrets.SMTP_USE_SSL }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
        run: python -u checkin.py --no-jitter

      - name: Save the next random checkin time
        if: ${{ always() && !cancelled() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        timeout-minutes: 3
        env:
          SCHEDULE_TOKEN: ${{ secrets.SCHEDULE_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python -u random_schedule.py

      - name: Upload failure screenshots
        if: steps.checkin.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: checkin-failure-screenshots
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7

      - name: Fail the job when checkin failed
        if: steps.checkin.outcome == 'failure'
        env:
          CHECKIN_OUTCOME: ${{ steps.checkin.outcome }}
        run: |
          echo "checkin step outcome: ${CHECKIN_OUTCOME}"
          exit 1
