name: Repository Keepalive

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repository-keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Create keepalive commit when needed
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail

          last_commit_epoch="$(git log -1 --format=%ct)"
          current_epoch="$(date -u +%s)"
          keepalive_seconds=$((45 * 24 * 60 * 60))
          commit_age=$((current_epoch - last_commit_epoch))
          commit_age_days=$((commit_age / 86400))

          echo "Latest commit age: ${commit_age_days} days."
          if (( commit_age < keepalive_seconds )); then
            echo "No keepalive commit needed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keep repository active"
          git push origin "HEAD:${DEFAULT_BRANCH}"

      - name: Repair an expired random checkin schedule
        timeout-minutes: 3
        env:
          SCHEDULE_TOKEN: ${{ secrets.SCHEDULE_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python -u random_schedule.py --repair
